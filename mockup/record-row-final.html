<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eef6f4;font-family:sans-serif;padding:8px}
  .phone{width:384px;background:#fff;padding:0}
  .screen{padding:0 20px 8px}
  .row{display:flex;align-items:center;padding:12px 10px 12px 14px;margin-bottom:8px;background:#fff;border-radius:14px;overflow:hidden;
       box-shadow:0 2px 8px rgba(22,50,59,.06)}
  .time{font-family:monospace;font-weight:700;font-size:10px;color:#16323b;white-space:nowrap;flex:0 0 auto}
  .info{color:#047857;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;margin-left:8px;font-size:12px}
  .btn{color:#be123c;border:1.5px solid #d3e9e3;background:#f7fcfa;border-radius:19px;padding:8px 9px;white-space:nowrap;flex:0 0 auto;margin-left:8px;font-size:13px}
  .cap{font-size:11px;color:#61808c;padding:5px 2px 3px}
</style></head><body>
<div class="phone"><div class="screen">
  <div class="cap">① 普通记录</div>
  <div class="row" data-cfg="F1"><span class="time">14:57:06</span><span class="info">东方树叶茶 500 ml · 0 kcal</span><span class="btn">删除</span></div>
  <div class="cap">② 白开水</div>
  <div class="row" data-cfg="F5"><span class="time">09:44:16</span><span class="info">白开水 550 ml · 0 kcal</span><span class="btn">删除</span></div>
  <div class="cap">③ 啤酒 1500ml</div>
  <div class="row" data-cfg="F2"><span class="time">23:59:59</span><span class="info">精酿啤酒 1500 ml · 825 kcal</span><span class="btn">删除</span></div>
  <div class="cap">④ 极端：8字名 + 2000ml + 1300kcal</div>
  <div class="row" data-cfg="F4"><span class="time">23:59:59</span><span class="info">一二三四五六七八 2000 ml · 1300 kcal</span><span class="btn">删除</span></div>
  <div class="cap">⑤ 最极端：+ 18000 kcal（几乎不会出现）</div>
  <div class="row" data-cfg="F3"><span class="time">23:59:59</span><span class="info">一二三四五六七八 2000 ml · 18000 kcal</span><span class="btn">删除</span></div>
</div></div>
</body></html>
