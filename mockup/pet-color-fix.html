<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9EDF0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
     padding:18px 12px 40px;display:flex;flex-direction:column;align-items:center}
.phead{width:100%;max-width:420px;margin:4px auto 18px}
.phead h1{font-size:19px;font-weight:800;color:#0F172A;letter-spacing:-.3px}
.phead p{font-size:12px;color:#475569;line-height:1.7;margin-top:7px}
.pair{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:640px}
.panel{width:250px;background:#fff;border-radius:18px;border:1px solid #E2E8EC;overflow:hidden}
.pttl{font-size:12.5px;font-weight:750;padding:11px 14px 9px;display:flex;align-items:center;gap:7px}
.badge{font-size:10px;font-weight:700;padding:2.5px 8px;border-radius:9px}
.badge.bad{background:#FFE4E6;color:#BE123C}
.badge.good{background:#D1FAE5;color:#047857}
.screen{background:linear-gradient(152deg,#F6FCF9,#F2F7FB 60%,#F3F2FB);padding:20px 0 24px;display:flex;
        flex-direction:column;align-items:center;gap:8px}
.svgbox{width:150px;height:160px}
.mood{font-size:11px;color:#7C939C}
.note{font-size:10.5px;color:#64748B;line-height:1.6;padding:11px 14px;border-top:1px solid #EEF3F2}
.note code{background:#F1F5F4;border-radius:4px;padding:1px 4px;font-size:10px;color:#0F766E}
</style></head><body>

<div class="phead">
  <h1>小人颜色修复 · 对照</h1>
  <p>根因：身体渐变用了「全透明底 Paint + shader」—— <b>Android 里 Paint 的 alpha=0 会把 shader 输出乘成透明</b>，所以身体整个不见，只剩五官和配件。修复：底色改为不透明（<code>0xFF000000</code>）。</p>
</div>

<div class="pair">
  <!-- 修复前 -->
  <div class="panel">
    <div class="pttl"><span class="badge bad">修复前</span> 你手机上看到的</div>
    <div class="screen">
      <div class="svgbox">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="90" rx="16" ry="3.4" fill="rgba(10,30,25,.12)"/>
          <!-- 身体透明（模拟 alpha=0 + shader 的 bug） -->
          <path d="M31 58 Q25 64 26 70" stroke="#063A2F" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M69 58 Q74 63 73 68" stroke="#063A2F" stroke-width="3" stroke-linecap="round" fill="none"/>
          <rect x="69" y="69" width="15" height="12" rx="2.5" fill="#B08968"/>
          <rect x="69" y="69" width="15" height="4.5" rx="2.2" fill="#8F6B4A"/>
          <path d="M73.5 69 L73.5 66.5 Q76.5 64.5 79.5 66.5 L79.5 69" stroke="#8F6B4A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M43 82 L40 88" stroke="#063A2F" stroke-width="3" stroke-linecap="round"/>
          <path d="M57 82 L61 88" stroke="#063A2F" stroke-width="3" stroke-linecap="round"/>
          <circle cx="43.5" cy="57" r="2.6" fill="#063A2F"/><circle cx="56.5" cy="57" r="2.6" fill="#063A2F"/>
          <path d="M40.1 52.6 L45.5 54.4" stroke="#063A2F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M59.9 52.6 L54.5 54.4" stroke="#063A2F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M45 67 Q47.5 64 50 67 Q52.5 70 55 67" stroke="#063A2F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M30 42 A9 9 0 0 1 44 38 A7 7 0 0 1 46 51 L31 51 A6.4 6.4 0 0 1 30 42 Z" fill="#93A7B4"/>
          <path d="M36 53 L35 58" stroke="#6FB3E0" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M41 53 L40 57.6" stroke="#6FB3E0" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M63 44 Q65 47.6 63 51 Q61 47.6 63 44 Z" fill="#7CC6F2"/>
        </svg>
      </div>
      <div class="mood">别人放假我搬砖</div>
    </div>
    <div class="note">只有乌云、五官、配件可见；<b>绿色身体整个消失</b>（含白色的高光残影）。</div>
  </div>

  <!-- 修复后 -->
  <div class="panel">
    <div class="pttl"><span class="badge good">修复后</span> 安装新版后</div>
    <div class="screen">
      <div class="svgbox">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="petg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2ECFA0"/><stop offset="1" stop-color="#0C8B6F"/>
          </linearGradient></defs>
          <ellipse cx="50" cy="90" rx="16" ry="3.4" fill="rgba(10,30,25,.12)"/>
          <ellipse cx="50" cy="60" rx="21" ry="24" fill="url(#petg)"/>
          <ellipse cx="44" cy="50" rx="8" ry="6" fill="rgba(255,255,255,.30)"/>
          <path d="M31 58 Q25 64 26 70" stroke="#063A2F" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M69 58 Q74 63 73 68" stroke="#063A2F" stroke-width="3" stroke-linecap="round" fill="none"/>
          <rect x="69" y="69" width="15" height="12" rx="2.5" fill="#B08968"/>
          <rect x="69" y="69" width="15" height="4.5" rx="2.2" fill="#8F6B4A"/>
          <path d="M73.5 69 L73.5 66.5 Q76.5 64.5 79.5 66.5 L79.5 69" stroke="#8F6B4A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M43 82 L40 88" stroke="#063A2F" stroke-width="3" stroke-linecap="round"/>
          <path d="M57 82 L61 88" stroke="#063A2F" stroke-width="3" stroke-linecap="round"/>
          <circle cx="43.5" cy="57" r="2.6" fill="#063A2F"/><circle cx="56.5" cy="57" r="2.6" fill="#063A2F"/>
          <path d="M40.1 52.6 L45.5 54.4" stroke="#063A2F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M59.9 52.6 L54.5 54.4" stroke="#063A2F" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M45 67 Q47.5 64 50 67 Q52.5 70 55 67" stroke="#063A2F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M30 42 A9 9 0 0 1 44 38 A7 7 0 0 1 46 51 L31 51 A6.4 6.4 0 0 1 30 42 Z" fill="#93A7B4"/>
          <path d="M36 53 L35 58" stroke="#6FB3E0" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M41 53 L40 57.6" stroke="#6FB3E0" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M63 44 Q65 47.6 63 51 Q61 47.6 63 44 Z" fill="#7CC6F2"/>
        </svg>
      </div>
      <div class="mood">别人放假我搬砖</div>
    </div>
    <div class="note">绿色渐变身体（<code>#2ECFA0 → #0C8B6F</code>）+ 左上白色柔光，与设计稿一致。</div>
  </div>
</div>

</body></html>
