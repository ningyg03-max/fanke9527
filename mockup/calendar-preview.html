<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工资日历 · 含外快（S26U 实尺寸）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0A1613}
body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
 width:384px;margin:0 auto;padding:18px 20px 26px;color:#E8F4F2}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav{width:44px;height:40px;border-radius:20px;background:#16302A;color:#2DD4BF;font-size:19px;
 display:flex;align-items:center;justify-content:center}
.title{flex:1;text-align:center;font-size:16px;font-weight:700}
.summary{background:linear-gradient(135deg,#0E5F4A,#12987A);border-radius:18px;padding:18px 20px;margin-bottom:14px;color:#fff}
.summary .lbl{font-size:11.5px;opacity:.8;letter-spacing:.1em}
.summary .amt{font-size:31px;font-weight:800;margin-top:6px;letter-spacing:-1px}
.summary .sub{font-size:12.5px;opacity:.85;margin-top:8px}
.card{background:#102623;border-radius:18px;padding:12px 10px}
.head{display:flex}
.head div{flex:1;text-align:center;font-size:10px;color:#7E9AA3;padding-bottom:6px}
.week{display:flex;margin-top:4px}
.cell{flex:1;height:62px;border-radius:10px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;margin-left:2px;overflow:hidden}
.cell:first-child{margin-left:0}
.cell.gap{background:transparent}
.d{font-size:11px;line-height:1.15}
.m{font-size:10px;font-weight:700;color:#34D399;line-height:1.2;margin-top:1px;letter-spacing:-.2px}
.o{font-size:9.5px;font-weight:700;color:#FCD34D;line-height:1.2;margin-top:1px;letter-spacing:-.2px}
.e{font-size:9.5px;font-weight:700;color:#60A5FA;line-height:1.2;margin-top:1px;letter-spacing:-.2px}
.tagm{font-size:9px;color:#7E9AA3;line-height:1.2;margin-top:1px}
.tagc{font-size:9px;color:#FCD34D;line-height:1.2;margin-top:1px}
.bg{background:#16302A}
.dim .d{color:#7E9AA3}
.today .d{color:#34D399;font-weight:700}
.sel{background:#1B4A3C;box-shadow:inset 0 0 0 1.5px #2DD4BF}
.sel .d{color:#5EEAD4;font-weight:700}
.detail{background:#102623;border-radius:18px;padding:14px 16px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}
.row .k{font-size:12.5px;color:#9FB8BE}
.row .v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.v.a{color:#FCD34D}.v.e{color:#60A5FA}.v.n{color:#E8F4F2}
.hr{height:1px;background:#1F3A38;margin-top:11px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.total .k{font-size:12.5px;color:#9FB8BE}
.total .v{font-size:18px;font-weight:800;color:#34D399;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#7E9AA3;margin:10px 2px 0}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.note{font-size:11px;color:#7E9AA3;line-height:1.75;margin:14px 2px 0}
.note b{color:#9FB8BE}
</style></head><body>

<div style="font-size:12px;color:#7E9AA3;margin-bottom:12px">SalaryJump 3.69 · 含外快 · 384dp 实尺寸</div>

<div class="top">
  <div class="nav">‹</div>
  <div class="title">2026 年 10 月</div>
  <div class="nav">›</div>
</div>

<div class="summary">
  <div class="lbl">本月合计</div>
  <div class="amt">¥ 7,028.27</div>
  <div class="sub">9 个工作日 · 日均 780.92 元 · 含外快 ¥200</div>
</div>

<div class="card" id="cal"></div>

<div class="lg">
  <span><i style="background:#34D399"></i>日薪</span>
  <span><i style="background:#FCD34D"></i>加班费</span>
  <span><i style="background:#60A5FA"></i>外快</span>
</div>

<div class="detail">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13.5px;font-weight:700">10 月 15 日 · 周四</span>
    <span style="font-size:12.5px;color:#2DD4BF">操作 ›</span>
  </div>
  <div style="font-size:11.5px;color:#9FB8BE;margin-top:4px">工作日 · 三个都有</div>
  <div class="row"><span class="k">日薪</span><span class="v n">¥ 1,007.78</span></div>
  <div class="row"><span class="k">加班费 · 3:37:20</span><span class="v a">¥ 781.59</span></div>
  <div class="row"><span class="k">外快 · 修图</span><span class="v e">¥ 200.00</span></div>
  <div class="hr"></div>
  <div class="total"><span class="k">当天到手</span><span class="v">¥ 1,989.37</span></div>
</div>

<div class="note">
  <b>三种金额各占一行、各有专色</b>：日薪绿 / 加班黄 / 外快蓝。<br>
  外快带「外」字前缀 —— 只看颜色容易看成一笔来源不明的钱。<br>
  格子 52 → <b>62dp</b>，放得下三行。
</div>

<script>
function fmtCompact(cents){
  const yuan = Math.round(cents/100);
  if(yuan<=0) return '';
  if(yuan<10000) return String(yuan);
  const wan10 = Math.round(yuan/1000);
  const whole = Math.floor(wan10/10), frac = wan10%10;
  return frac===0 ? whole+'万' : whole+'.'+frac+'万';
}
const fmtFull = c => (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// 演示数据：{base, ot, extra, tag}
const DAY = {
  6 :{tag:'调休'},
  8 :{base:100778},
  9 :{base:100778},
  10:{base:100778},
  11:{tag:'调休'},
  12:{base:100778},
  13:{base:100778},
  14:{base:100778, ot:78159},
  15:{base:100778, ot:78159, extra:20000},   // 三个都有
  16:{base:100778, extra:50000},             // 日薪 + 外快
  19:{extra:80000},                          // 只接私活
};
const REST = new Set([1,2,3,4,5,7,17,18,24,25,31]);
const TODAY = 15, SEL = 15;

const cal = document.getElementById('cal');
const h = document.createElement('div'); h.className='head';
['日','一','二','三','四','五','六'].forEach(w=>{const d=document.createElement('div');d.textContent=w;h.appendChild(d);});
cal.appendChild(h);

let day = 1;
const lead = 4, total = 31;
for(let r=0;r<Math.ceil((lead+total)/7);r++){
  const w = document.createElement('div'); w.className='week';
  for(let c=0;c<7;c++){
    const cell = document.createElement('div'); cell.className='cell';
    const idx = r*7+c;
    if(idx<lead || day>total){ cell.classList.add('gap'); w.appendChild(cell); continue; }
    const rec = DAY[day] || {};
    const hasContent = rec.base || rec.ot || rec.extra || rec.tag;
    if(hasContent) cell.classList.add('bg');
    if((!hasContent && REST.has(day)) || day>TODAY) cell.classList.add('dim');
    if(day===TODAY) cell.classList.add('today','bg');
    if(day===SEL) cell.classList.add('sel');

    const d = document.createElement('div'); d.className='d'; d.textContent=day; cell.appendChild(d);
    if(rec.base || rec.ot){
      if(rec.base){const m=document.createElement('div');m.className='m';m.textContent=fmtCompact(rec.base);cell.appendChild(m);}
      if(rec.ot){const o=document.createElement('div');o.className='o';o.textContent='+'+fmtCompact(rec.ot);cell.appendChild(o);}
    }
    if(rec.extra){const e=document.createElement('div');e.className='e';e.textContent='外 '+fmtCompact(rec.extra);cell.appendChild(e);}
    if(rec.tag){const t=document.createElement('div');t.className=rec.tag==='调休'?'tagc':'tagm';t.textContent=rec.tag;cell.appendChild(t);}
    w.appendChild(cell);
    day++;
  }
  cal.appendChild(w);
}
</script>
</body></html>
