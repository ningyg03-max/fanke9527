<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eef6f4;font-family:sans-serif;padding:10px}
  .phone{width:384px;background:#fff}
  .screen{padding:0 20px}
  /* D：紧凑方案 —— 行内边距 14/10，时间戳 10sp */
  .rowD{display:flex;align-items:center;padding:12px 10px 12px 14px;margin-bottom:8px;background:#fff;border-radius:14px;overflow:hidden}
  .rowD .time{font-family:monospace;font-weight:700;font-size:10px;color:#16323b;white-space:nowrap;flex:0 0 auto}
  .rowD .info{color:#047857;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;margin-left:8px}
  .rowD .btn{color:#be123c;border:1.5px solid #d3e9e3;background:#f7fcfa;border-radius:19px;padding:8px 9px;white-space:nowrap;flex:0 0 auto;margin-left:10px}
  .cap{font-size:11px;color:#61808c;padding:6px 2px 3px}
</style></head><body>
<div class="phone"><div class="screen">

  <div class="cap">D · ts=10sp / info=12.5sp / 紧凑边距</div>
  <div class="rowD" data-cfg="D1"><span class="time">23:59:59</span><span class="info" style="font-size:12.5px">东方树叶茶 500 ml · 0 kcal</span><span class="btn" style="font-size:12.5px">删除</span></div>
  <div class="rowD" data-cfg="D2"><span class="time">23:59:59</span><span class="info" style="font-size:12.5px">精酿啤酒 1500 ml · 825 kcal</span><span class="btn" style="font-size:12.5px">删除</span></div>
  <div class="rowD" data-cfg="D3"><span class="time">23:59:59</span><span class="info" style="font-size:12.5px">一二三四五六七八 2000 ml · 18000 kcal</span><span class="btn" style="font-size:12.5px">删除</span></div>
  <div class="rowD" data-cfg="D4"><span class="time">23:59:59</span><span class="info" style="font-size:12.5px">一二三四五六七八 2000 ml · 1100 kcal</span><span class="btn" style="font-size:12.5px">删除</span></div>

  <div class="cap">E · ts=10sp / info=13sp / 紧凑边距</div>
  <div class="rowD" data-cfg="E1"><span class="time">23:59:59</span><span class="info" style="font-size:13px">东方树叶茶 500 ml · 0 kcal</span><span class="btn" style="font-size:13px">删除</span></div>
  <div class="rowD" data-cfg="E4"><span class="time">23:59:59</span><span class="info" style="font-size:13px">一二三四五六七八 2000 ml · 1100 kcal</span><span class="btn" style="font-size:13px">删除</span></div>

</div></div>
</body></html>
